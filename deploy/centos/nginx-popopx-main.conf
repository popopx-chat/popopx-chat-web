# POPOPX main portal — production Nginx vhost for CentOS / RHEL / Rocky / Alma.
#
# This portal is a Next.js *static export*: `npm run build` writes `out/`, which
# is plain HTML/CSS/JS/PNG/SVG with no server-side runtime. So this vhost only
# has to (1) serve those files, (2) resolve the trailing-slash directory index
# files the export produces, (3) send strict security headers, and (4) leak
# nothing to third parties.
#
# Install order matters, and `deploy/centos/deploy_centos.sh` does it for you:
#   1. put the built `out/` into $WEB_ROOT (default /var/www/popopx.chat)
#   2. get the certificate first (`certbot certonly --webroot ...`), because this
#      file references /etc/letsencrypt/live/popopx.chat/*.pem — `nginx -t`
#      would fail on a missing key
#   3. cp this file to /etc/nginx/conf.d/ ; nginx -t ; systemctl reload nginx
#
# Requirements: nginx >= 1.9.5. HTTP/2 is enabled with the `listen … 443 ssl http2;`
# parameter form on purpose: every build from 1.9.5 to current accepts it, whereas the
# newer standalone `http2 on;` directive only exists from 1.25.1 — and EPEL on
# CentOS/RHEL ships 1.14 to 1.24, where `http2 on;` is an `[emerg] unknown directive`
# that fails `nginx -t` and pins the previously loaded config in place. On nginx
# >= 1.25.1, `nginx -t` prints a deprecation notice about the parameter form; it is
# harmless, and switching to `http2 on;` there is an optional cosmetic change.
#
# The two sibling portals (`node.popopx.chat`, `mp.popopx.chat`) are named in this
# file ONLY in comments. They are separate origins on their own document roots and
# their own vhosts; nothing here proxies, rewrites or aliases them. That is also why
# `deploy_centos.sh` protects those two hostnames before it substitutes a host:
# a naive `s/popopx.chat/$SITE_HOST/g` would turn them into
# `node.<host>` and `mp.<host>` in every copy of this file.

# The entry HTML is the only artifact that names the fingerprinted chunks, and
# `rsync --delete` removes the previous ones on every redeploy, so a cached
# index.html is a portal that 404s its own JS. `no-cache` forces revalidation
# (the ETag makes that a 304). It is keyed on the response type instead of being
# written in `location /` because nginx inherits `add_header` only into blocks
# that declare none of their own — a single add_header in that location would
# silently drop every security header above it.
#
# The variable name is portal-specific (`$popopx_main_html_cache`): a `map` block
# is global to the http context, so two installed sites that both called it
# `$popopx_html_cache` would fail `nginx -t` with a duplicate-map error.
map $sent_http_content_type $popopx_main_html_cache {
    default       "";
    ~^text/html   "no-cache";
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenge only, everything else moves to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen       80;
    listen       [::]:80;
    server_name  popopx.chat;

    root /var/www/popopx.chat;

    # `certbot certonly --webroot -w /var/www/popopx.chat` writes here.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /.well-known/acme-challenge/ {
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/popopx.chat.http.access.log combined;
    error_log  /var/log/nginx/popopx.chat.error.log warn;
}

# ---------------------------------------------------------------------------
# HTTPS: the static portal.
# ---------------------------------------------------------------------------
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  popopx.chat;

    root  /var/www/popopx.chat;
    index index.html;

    server_tokens off;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/popopx.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/popopx.chat/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:POPOPX_MAIN:10m;
    ssl_session_timeout       1d;

    # OCSP stapling needs a resolver; adjust for your network if these fail.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # If you run `certbot --nginx -d popopx.chat` instead of the `certonly`
    # path above, Certbot rewrites this server block and adds these two lines
    # itself. They are left commented so `nginx -t` does not fail on a file that
    # only exists after Certbot has run.
    # include     /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ----------------------------------------------------
    # Everything fetchable is same-origin: the export bundles every script into
    # /_next/static, the logo is a same-origin PNG and the QR code is inline SVG
    # rendered in the visitor's browser. `script-src` nevertheless needs
    # 'unsafe-inline', because a Next.js App Router export ships its RSC flight
    # payload as inline `self.__next_f.push(...)` scripts — many pushes share one
    # minified line, so count occurrences, not lines:
    #   grep -o 'self\.__next_f\.push' out/index.html | wc -l
    # — and CSP judges inline code by position, not origin: without it the router
    # boots with no payload and replaces the prerendered root with an empty one —
    # a black page. Hashes/nonces are not viable on a hand-deployed export, since
    # the payload changes with every copy edit. Remote origins stay blocked,
    # which is what the "no third-party scripts" claim rests on.
    # `style-src 'unsafe-inline'` is required because React emits inline
    # style attributes; there is no `connect-src` wildcard because the page
    # talks to nobody but this origin.
    add_header X-Frame-Options                        "DENY"            always;
    add_header X-Content-Type-Options                 "nosniff"         always;
    add_header Referrer-Policy                        "no-referrer"     always;
    add_header X-DNS-Prefetch-Control                 "off"             always;
    add_header X-Permitted-Cross-Domain-Policies      "none"            always;
    add_header Cross-Origin-Opener-Policy             "same-origin"     always;
    add_header Cross-Origin-Resource-Policy           "same-origin"     always;
    add_header Strict-Transport-Security              "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), web-share=(), xr-spatial-tracking=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control $popopx_main_html_cache always;

    # COEP is left off deliberately: `require-corp` plus CORP same-origin is
    # enough for a single-origin page, and turning it on is the classic way to
    # break your own assets on a mis-configured host.
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # --- Static assets -------------------------------------------------------
    # Next.js fingerprints everything under /_next/static, so it is immutable.
    # HTML must never be cached, or a visitor keeps an outdated portal.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # images.unoptimized is set for the export, so the optimiser route has
    # nothing to do and must not be reachable.
    location = /_next/image {
        return 404;
    }

    location = /logo-popopx.png {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /logo-popopx-512.png {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /favicon.png {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /apple-touch-icon.png {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header   Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        expires    1d;
        access_log off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires    1d;
        access_log off;
    }

    # --- Deep-link association files -----------------------------------------
    # Both are built from `public/.well-known/` and are read by the operating
    # system, not by a browser: iOS fetches `apple-app-site-association` and
    # Android fetches `assetlinks.json` to decide whether a tap on
    # `https://popopx.chat/i/v1/<code>` opens the client.
    #
    # `default_type application/json` is the load-bearing line for the AASA: it
    # has no extension, so without it nginx answers
    # `Content-Type: application/octet-stream`, and iOS rejects the file in
    # silence — the association simply never activates and there is no error
    # anywhere to read. `assetlinks.json` needs it too: Google's digital-asset
    # parser rejects a response that is not JSON-typed, and the tooling that
    # checks it (`adb shell pm get-app-links`) reports only "no response".
    #
    # `expires` is used instead of `add_header Cache-Control` on purpose: a
    # location that declares any `add_header` stops inheriting the server-level
    # ones, so writing the cache header that way would silently drop HSTS,
    # nosniff and the CSP from these two responses.
    #
    # A redeploy refreshes the files, but each platform caches them on its own
    # schedule (Apple's CDN on the order of hours), so a change here is not
    # instantly visible to every device.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        expires      1h;
        access_log   off;
        try_files    $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        expires      1h;
        access_log   off;
        try_files    $uri =404;
    }

    # --- Compression ---------------------------------------------------------
    # gzip is built into nginx; brotli needs the third-party ngx_brotli module,
    # so those directives are documented rather than claimed as active.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/html
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ngx_brotli (dnf install nginx-mod-brotli on some distros, or build it):
    #   load_module modules/ngx_http_brotli_filter_module.so;
    #   load_module modules/ngx_http_brotli_static_module.so;
    #   brotli on;
    #   brotli_comp_level 6;
    #   brotli_types text/css text/html application/javascript application/json image/svg+xml;

    # --- Routing -------------------------------------------------------------
    # `trailingSlash: true` makes every route a directory with an index.html, so
    # a plain try_files chain is enough. There is no SPA rewrite and no backend
    # to proxy: this portal never calls an API.

    # The invitation landing page, and the reason the chain ends in a file
    # instead of `=404`. `/i/v1/` is a built document; `/i/v1/<code>` is not and
    # cannot be — a dynamic segment needs `generateStaticParams` under
    # `output: "export"`, and enumerating invitation codes at build time is
    # exactly what the sealed `/i/v1/` form exists to avoid. So every code-shaped
    # path is answered with the same document and the browser reads the code out
    # of `window.location.pathname`.
    #
    # `access_log off` is the privacy load-bearing line, not an optimisation: the
    # code is a bearer token for a connection, and the default `combined` format
    # writes the full request URI next to the visitor's IP and timestamp. With
    # the log off for the whole prefix, an invitation never reaches the host's
    # disk. The trade-off is that this path has no traffic counter at all.
    #
    # The fallback target keeps the `/i/v1/` prefix on purpose. `try_files`
    # issues an internal redirect for a URI argument, and a redirect re-runs
    # location matching, and the access log is decided by the location the
    # request *finishes* in — so a target like `/i/v1.html` or `/index.html`
    # would land in `location /` and log the code anyway. Landing back inside
    # this block is what keeps `access_log off` true.
    location ^~ /i/v1/ {
        access_log off;
        try_files  $uri $uri/index.html /i/v1/index.html;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Nothing in this build is executable: no PHP, no Node server, no proxy.
    location ~* \.(?:php|pl|py|cgi|sh|env|ini|lock|bak|old)$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/popopx.chat.access.log combined;
    error_log  /var/log/nginx/popopx.chat.error.log warn;
}
